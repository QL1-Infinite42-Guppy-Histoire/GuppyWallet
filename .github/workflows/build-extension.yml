name: Build Extension

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "extension/**"
      - "src/**"
      - ".github/workflows/build-extension.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        # The extension imports the app's shared TS sources; vite's
        # esbuild step resolves the app tsconfig chain (expo base),
        # so the app tree must be installed too.
        run: npm ci
      - name: Install dependencies
        working-directory: extension
        run: npm ci
      # NOTE: no tsc step in CI — the extension's typecheck follows
      # type-only imports into the app's RN sources and needs the
      # app's full node_modules. The vite build is the CI gate; run
      # `npm run typecheck` locally where the app deps exist.
      - name: Build
        working-directory: extension
        run: npm run build
      - name: Zip
        working-directory: extension/dist
        run: zip -qr ../guppy-wallet-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: guppy-wallet-extension
          path: extension/guppy-wallet-extension.zip
